<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeBite — History</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<canvas id="trail-canvas"></canvas>
<div class="custom-appy-cursor" id="appy-cursor"></div>

<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">SAFEBITE<span class="nav-logo-dot">.</span></a>
    <ul class="nav-links">
      <li class="nav-item"><a href="dashboard.html"><span class="nav-frame"><img src="assets/appy/static/sit.png" alt=""></span>Dashboard</a></li>
      <li class="nav-item"><a href="scan.html"><span class="nav-frame"><img src="assets/appy/static/read.png" alt=""></span>Scan</a></li>
      <li class="nav-item"><a href="craving-search.html"><span class="nav-frame"><img src="assets/appy/static/drinkwalk.png" alt=""></span>Craving Search</a></li>
      <li class="nav-item"><a href="history.html"><span class="nav-frame"><img src="assets/appy/static/think.png" alt=""></span>History</a></li>
    </ul>
  </div>
</nav>

<main class="app-main">
  <div class="app-shell">
    <div class="app-topbar">
      <a href="dashboard.html" class="app-back">←</a>
      <div><h1 class="app-heading split-title">Scan History</h1></div>
    </div>

    <div style="display:flex;gap:0.6rem;margin-bottom:1.5rem;">
      <button class="brutal-btn filter-btn active" data-filter="all">All</button>
      <button class="brutal-btn filter-btn" data-filter="safe">Safe</button>
      <button class="brutal-btn filter-btn" data-filter="flagged">Flagged</button>
      <button class="brutal-btn filter-btn" data-filter="unclear">Unclear</button>
    </div>

    <div id="history-list"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="script.js"></script>
<script>
const API_BASE = 'http://localhost:8000';
let allScans = [];

function render(filter){
  const list = document.getElementById('history-list');
  const scans = filter === 'all' ? allScans : allScans.filter(s => s.verdict === filter);
  if (!scans.length){
    list.innerHTML = '<p style="opacity:0.6;">No scans yet — go scan something.</p>';
    return;
  }
  list.innerHTML = scans.map(scan => `
    <a href="verdict.html?scanId=${scan.scanId}" class="scan-thumb" style="display:flex;flex-direction:row;align-items:center;justify-content:space-between;width:100%;margin-bottom:0.8rem;">
      <span>
        <strong>${scan.productName}</strong><br>
        <span class="scan-thumb-date">${scan.date}</span>
      </span>
      <span class="verdict-tag verdict-tag--${scan.verdict}">${scan.verdict.toUpperCase()}</span>
    </a>
  `).join('');
}

fetch(`${API_BASE}/api/scans`)
  .then(r => r.json())
  .then(scans => { allScans = scans; render('all'); })
  .catch(err => {
    console.error(err);
    document.getElementById('history-list').innerHTML =
      `<p>Couldn't load history — is the backend running on ${API_BASE}?</p>`;
  });

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});
</script>
</body>
</html>
