<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeBite — Craving Search</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<canvas id="trail-canvas"></canvas>
<div class="custom-appy-cursor" id="appy-cursor"></div>

<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">SAFEBITE<span class="nav-logo-dot">.</span></a>
    <ul class="nav-links">
      <li class="nav-item"><a href="dashboard.html"><span class="nav-frame"><img src="assets/appy/static/sit.png" alt=""></span>Dashboard</a></li>
      <li class="nav-item"><a href="scan.html"><span class="nav-frame"><img src="assets/appy/static/read.png" alt=""></span>Scan</a></li>
      <li class="nav-item"><a href="craving-search.html"><span class="nav-frame"><img src="assets/appy/static/drinkwalk.png" alt=""></span>Craving Search</a></li>
      <li class="nav-item"><a href="history.html"><span class="nav-frame"><img src="assets/appy/static/think.png" alt=""></span>History</a></li>
    </ul>
  </div>
</nav>

<main class="app-main">
  <div class="app-shell" style="max-width:600px;">
    <div class="app-topbar">
      <a href="dashboard.html" class="app-back">←</a>
      <div>
        <h1 class="app-heading split-title">What are you craving?</h1>
      </div>
    </div>

    <form id="craving-form" class="dash-craving">
      <div class="dash-craving-input-row">
        <input type="text" id="craving-input" placeholder="e.g. something crunchy and salty" autofocus>
        <button type="submit" class="brutal-btn brutal-btn--yellow">GO</button>
      </div>
    </form>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="script.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const prefill = params.get('q');
if (prefill) document.getElementById('craving-input').value = prefill;

document.getElementById('craving-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = encodeURIComponent(document.getElementById('craving-input').value || '');
  window.location.href = `swaps.html?q=${q}`;
});
</script>
</body>
</html>
