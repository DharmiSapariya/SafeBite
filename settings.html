<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeBite — Settings</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<canvas id="trail-canvas"></canvas>
<div class="custom-appy-cursor" id="appy-cursor"></div>

<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">SAFEBITE<span class="nav-logo-dot">.</span></a>
    <ul class="nav-links">
      <li class="nav-item"><a href="dashboard.html"><span class="nav-frame"><img src="assets/appy/static/sit.png" alt=""></span>Dashboard</a></li>
      <li class="nav-item"><a href="scan.html"><span class="nav-frame"><img src="assets/appy/static/read.png" alt=""></span>Scan</a></li>
      <li class="nav-item"><a href="craving-search.html"><span class="nav-frame"><img src="assets/appy/static/drinkwalk.png" alt=""></span>Craving Search</a></li>
      <li class="nav-item"><a href="history.html"><span class="nav-frame"><img src="assets/appy/static/think.png" alt=""></span>History</a></li>
    </ul>
  </div>
</nav>

<main class="app-main">
  <div class="app-shell" style="max-width:600px;">
    <div class="app-topbar">
      <a href="dashboard.html" class="app-back">←</a>
      <div><h1 class="app-heading split-title">Settings</h1></div>
    </div>

    <div class="ingredient-card">
      <div class="ingredient-block-label">ALLERGEN PROFILE</div>
      <div class="choice-chip-grid" id="allergen-grid" style="margin:0.8rem 0 1.5rem;">
        <button type="button" class="choice-chip" data-value="peanut">Peanut</button>
        <button type="button" class="choice-chip" data-value="tree-nut">Tree Nut</button>
        <button type="button" class="choice-chip" data-value="dairy">Dairy</button>
        <button type="button" class="choice-chip" data-value="gluten">Gluten</button>
        <button type="button" class="choice-chip" data-value="egg">Egg</button>
        <button type="button" class="choice-chip" data-value="shellfish">Shellfish</button>
        <button type="button" class="choice-chip" data-value="soy">Soy</button>
      </div>
      <button id="save-btn" class="brutal-btn brutal-btn--yellow">SAVE CHANGES</button>
      <span id="save-status" style="font-size:0.8rem;margin-left:0.8rem;opacity:0.7;"></span>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="script.js"></script>
<script>
const API_BASE = 'http://localhost:8000';
const grid = document.getElementById('allergen-grid');
const selected = new Set();

fetch(`${API_BASE}/api/profile`)
  .then(r => r.json())
  .then(profile => {
    (profile.allergens || []).forEach(val => {
      selected.add(val);
      const chip = grid.querySelector(`[data-value="${val}"]`);
      if (chip) chip.classList.add('active');
    });
  });

grid.querySelectorAll('.choice-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const val = chip.dataset.value;
    if (selected.has(val)){ selected.delete(val); chip.classList.remove('active'); }
    else { selected.add(val); chip.classList.add('active'); }
  });
});

document.getElementById('save-btn').addEventListener('click', () => {
  fetch(`${API_BASE}/api/profile`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ allergens: Array.from(selected) })
  })
  .then(r => r.json())
  .then(() => { document.getElementById('save-status').textContent = 'Saved ✓'; })
  .catch(() => { document.getElementById('save-status').textContent = 'Failed to save — is the backend running?'; });
});
</script>
</body>
</html>
